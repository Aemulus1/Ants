<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b98a52">
<title>Kleur-sudoku</title>
<style>
:root{color-scheme:light;--ink:#263238;--muted:#58615e;--block-thickness:clamp(3px,.42vw,5px)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#efdfc7 0,#b98a52 85%);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink);padding:12px 10px 24px}
main{width:min(100%,1450px);margin:auto}header{text-align:center;margin:2px 0 9px}h1{font-size:clamp(23px,3.2vw,34px);margin:0 0 3px;font-weight:760;color:#263831}header p{margin:0;color:#4d514e;font-size:13px}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0 12px}label{font-size:13px;color:#38443e}select,button.action{font:600 13px system-ui;color:#34413a;background:#f8f5ed;border:1px solid #d5d0c5;border-radius:999px;padding:9px 13px}select{border-radius:10px}button.action{cursor:pointer}button.action.primary{background:#2d453a;color:white;border-color:#2d453a}button.action:hover{filter:brightness(.97)}
.scene{position:relative;width:100%;aspect-ratio:1672/938;overflow:hidden;border-radius:9px;box-shadow:0 18px 50px #301d0c55;background:#7b512d}
.scene-art{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none}
.board{position:absolute;left:25.7%;top:16.05%;width:38.35%;height:61.75%;display:grid;border:3px solid #23362d;overflow:hidden;background:#b8bec0;z-index:2;touch-action:manipulation}
.cell{min-width:0;min-height:0;padding:0;border:0;background:#b8bec0;cursor:pointer;transition:filter .1s,box-shadow .1s}.cell.given{cursor:default}.cell.selected{box-shadow:inset 0 0 0 3px #fff1c6;z-index:1;filter:saturate(1.08)}.cell.conflict{box-shadow:inset 0 0 0 3px #a63332;z-index:2}.cell:focus-visible{outline:2px solid #fff1c6;outline-offset:-3px;z-index:3}
.palette{position:absolute;left:69.8%;top:15.2%;width:4.65%;height:64.1%;display:grid;grid-template-rows:repeat(15,minmax(0,1fr));gap:.32%;z-index:5}.swatch{position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:42%;background:transparent;cursor:pointer;touch-action:manipulation}.swatch::before{content:"";position:absolute;inset:12% 8%;border-radius:38%;background:var(--tint);mix-blend-mode:color;opacity:.78;pointer-events:none}.swatch.active{outline:2px solid #fff6d6;box-shadow:0 0 0 3px #293c33;z-index:1}.swatch.active::before{opacity:.38}.swatch.disabled{cursor:default;pointer-events:none}.swatch.disabled::after{content:"";position:absolute;inset:13% 9%;border-radius:34%;background:rgba(7,20,15,.78);box-shadow:inset 0 0 0 1px #b59660;pointer-events:none}
.status{text-align:center;min-height:20px;margin:8px auto 0;color:#283a33;font-size:13px}.legend{text-align:center;color:#4d514e;font-size:12px;margin-top:0}
@media(max-width:700px){body{padding:8px 4px 18px}.scene{min-width:670px;width:100%;border-radius:5px}.scene-scroll{overflow-x:auto;padding:0 0 8px}.controls{gap:6px}button.action,select{padding:8px 10px;font-size:12px}.swatch.active{outline-width:1px;box-shadow:0 0 0 2px #293c33}}
</style>
</head>
<body>
<main>
<header><h1>Kleur-sudoku</h1><p>Elke kleur één keer per rij, kolom en groot vak.</p></header>

<div class="status" id="status" aria-live="polite"></div><div class="legend" id="legend"></div>
<script>
(()=>{
const palette=[
 ['#D62828','Rood'],['#F77F00','Oranje'],['#FFD60A','Geel'],['#A8D96C','Lichtgroen'],['#1B5E20','Smaragdgroen'],
 ['#152018','Onyxzwart'],['#00A6A6','Turkoois'],['#36A9F2','Hemelsblauw'],['#E9F8FB','IJsblauw'],['#125BDB','Kobaltblauw'],
 ['#050505','Zwart'],['#70408F','Donkerpaars'],['#C9008B','Magenta'],['#F471A6','Roze'],['#795548','Bruin']
];
const board=document.getElementById('board'),strip=document.getElementById('palette'),status=document.getElementById('status'),sizeSelect=document.getElementById('size'),legend=document.getElementById('legend');
let size=9,boxH=3,boxW=3,solution=[],values=[],fixed=[],selected=-1,chosen=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function groupedOrder(n,g){const groups=shuffle(Array.from({length:n/g},(_,i)=>i));return groups.flatMap(x=>shuffle(Array.from({length:g},(_,i)=>x*g+i)))}
function makeBoard(){
 size=Number(sizeSelect.value);boxH=3;boxW=size/3;chosen=0;selected=-1;status.textContent='';
 const rows=groupedOrder(size,boxH),cols=groupedOrder(size,boxW),symbols=shuffle(Array.from({length:size},(_,i)=>i+1));solution=Array(size*size);
 for(let r=0;r<size;r++)for(let c=0;c<size;c++)solution[r*size+c]=symbols[(rows[r]*boxW+Math.floor(rows[r]/boxH)+cols[c])%size];
 const clues=Math.round(size*size*(size===9?.47:size===12?.49:.51));values=Array(size*size).fill(0);fixed=Array(size*size).fill(false);
 shuffle(Array.from({length:size*size},(_,i)=>i)).slice(0,clues).forEach(i=>{values[i]=solution[i];fixed[i]=true});
 legend.textContent=`Grote vakken: drie rijen bij ${boxW} kolommen.`;paint();
}
function paint(){
 board.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${size},minmax(0,1fr))`;board.innerHTML='';
 for(let i=0;i<size*size;i++){
  const r=Math.floor(i/size),c=i%size,b=document.createElement('button');b.type='button';b.className='cell'+(fixed[i]?' given':'')+(selected===i?' selected':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Rij ${r+1}, kolom ${c+1}${values[i]?' ingevuld':' leeg'}`);b.style.backgroundColor=values[i]?palette[values[i]-1][0]:'#b8bec0';
  b.style.borderRight=c===size-1?'0':(c%boxW===boxW-1?'var(--block-thickness) solid #23362d':'1px solid #81898b');b.style.borderBottom=r===size-1?'0':(r%boxH===boxH-1?'var(--block-thickness) solid #23362d':'1px solid #81898b');
  b.onclick=()=>{selected=i;if(!fixed[i]&&!values[i]&&chosen)values[i]=chosen;status.textContent='';paint()};board.appendChild(b);
 }
 strip.innerHTML='';palette.forEach(([color,name],i)=>{const b=document.createElement('button');b.type='button';b.className='swatch'+(chosen===i+1?' active':'')+(i>=size?' disabled':'');b.style.setProperty('--tint',color);b.title=name;b.setAttribute('aria-label',name+(i>=size?' niet beschikbaar in dit formaat':''));if(i<size)b.onclick=()=>{chosen=i+1;status.textContent='';paint()};strip.appendChild(b)});
}
function conflicts(){const bad=new Set();for(let i=0;i<size*size;i++)if(values[i])for(let j=i+1;j<size*size;j++)if(values[i]===values[j]){const r1=Math.floor(i/size),c1=i%size,r2=Math.floor(j/size),c2=j%size;if(r1===r2||c1===c2||(Math.floor(r1/boxH)===Math.floor(r2/boxH)&&Math.floor(c1/boxW)===Math.floor(c2/boxW))){bad.add(i);bad.add(j)}}return bad}
document.getElementById('erase').onclick=()=>{if(selected>=0&&!fixed[selected]){values[selected]=0;status.textContent='';paint()}};
document.getElementById('check').onclick=()=>{const bad=conflicts();[...board.children].forEach((c,i)=>c.classList.toggle('conflict',bad.has(i)));status.textContent=bad.size?'Er staan kleuren dubbel in een rij, kolom of groot vak.':values.includes(0)?'Tot nu toe klopt alles. Er zijn nog lege vakjes.':'Het bord klopt helemaal.'};
document.getElementById('new').onclick=makeBoard;sizeSelect.onchange=makeBoard;
board.addEventListener('keydown',e=>{const d={ArrowUp:-size,ArrowDown:size,ArrowLeft:-1,ArrowRight:1}[e.key];if(d===undefined)return;e.preventDefault();selected=Math.max(0,Math.min(size*size-1,(selected<0?0:selected)+d));paint();board.children[selected]?.focus()});makeBoard();
})();
</script>
</main>
</body>
</html>
