<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2eee6">
<title>Kleur-sudoku</title>
<style>
:root{color-scheme:light;--ink:#263238;--muted:#687477;--paper:#f2eee6;--panel:#fffdf8;--line:#c9c4b8;--heavy:#5b625d;--accent:#283a34}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -8%,#fffdf6 0,#f2eee6 60%);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:22px 14px 32px}
main{width:min(100%,690px)}header{text-align:center;margin:3px 0 16px}h1{font-size:clamp(25px,5vw,37px);letter-spacing:.01em;margin:0 0 5px;font-weight:750;color:#263831}header p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid #e1ddd3;border-radius:20px;padding:clamp(12px,3.8vw,24px);box-shadow:0 12px 36px #433c2710}
.board-wrap{width:100%;display:flex;justify-content:center}.board{width:min(100%,570px);aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:3px solid var(--heavy);border-radius:8px;overflow:hidden;background:#fff;touch-action:manipulation}
.cell{padding:0;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;position:relative;cursor:pointer;transition:filter .12s,box-shadow .12s}
.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}
.cell:nth-child(3n):not(:nth-child(9n)){border-right:3px solid var(--heavy)}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid var(--heavy)}
.cell.given{cursor:default}.cell.selected{box-shadow:inset 0 0 0 4px #172b23;z-index:1;filter:saturate(1.08)}.cell.conflict{box-shadow:inset 0 0 0 3px #a63332;z-index:1}.cell:focus-visible{outline:3px solid #182820;outline-offset:-4px;z-index:2}
.palette-label{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 9px}.palette{display:grid;grid-template-columns:repeat(9,minmax(25px,1fr));gap:7px;max-width:500px;margin:auto}.swatch{aspect-ratio:1;border:2px solid #ffffff;border-radius:10px;box-shadow:0 0 0 1px #b7b4ac;cursor:pointer;transition:transform .12s,box-shadow .12s}.swatch:hover{transform:translateY(-2px)}.swatch.active{box-shadow:0 0 0 3px #263831;transform:scale(1.04)}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:17px 0 4px}button.action{border:1px solid #d5d0c5;border-radius:999px;background:#f8f5ed;color:#34413a;padding:10px 15px;font:600 13px/1 system-ui;cursor:pointer}button.action.primary{background:#2d453a;color:white;border-color:#2d453a}button.action:hover{filter:brightness(.97)}.status{text-align:center;min-height:22px;margin:12px 0 0;color:#52635a;font-size:14px}.legend{text-align:center;color:#7b8079;font-size:12px;margin-top:2px}
@media(max-width:430px){body{padding:12px 9px 24px}.card{border-radius:15px;padding:10px}.palette{gap:5px}.swatch{border-radius:8px}.cell.selected{box-shadow:inset 0 0 0 3px #172b23}.controls{gap:6px}button.action{padding:10px 12px;font-size:12px}}
</style>
</head>
<body>
<main>
<header><h1>Kleur-sudoku</h1><p>Elke kleur één keer per rij, kolom en groot vak.</p></header>
<section class="card" aria-label="Kleur-sudoku">
<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Sudokubord"></div></div>
<p class="palette-label">Kies een kleur en vul een leeg vakje</p>
<div class="palette" id="palette" role="toolbar" aria-label="Kleuren"></div>
<div class="controls">
<button class="action" id="erase">Wis vakje</button>
<button class="action primary" id="check">Controleer</button>
<button class="action" id="new">Nieuw bord</button>
</div>
<div class="status" id="status" aria-live="polite"></div>
<div class="legend">De dikke lijnen verdelen het bord in vakken van drie bij drie.</div>
</section>
</main>
<script>
(()=>{
const colors=['#e85d52','#ef9e39','#e6c942','#65aa69','#39a9a4','#4d82cf','#765abd','#d75c98','#875b43'];
const puzzle=[0,0,0,2,6,0,7,0,1,6,8,0,0,7,0,0,9,0,1,9,0,0,0,4,5,0,0,8,2,0,1,0,0,0,4,0,0,0,4,6,0,2,9,0,0,0,5,0,0,3,0,0,2,8,0,0,9,3,0,0,0,7,4,0,4,0,0,5,0,0,3,6,7,0,3,0,1,8,0,0,0];
const board=document.getElementById('board'),palette=document.getElementById('palette'),status=document.getElementById('status');let solution=[],values=[],fixed=[],selected=-1,chosen=0;
function makeSolution(){let base=[4,3,5,2,6,9,7,8,1,6,8,2,5,7,1,4,9,3,1,9,7,8,3,4,5,6,2,8,2,6,1,9,5,3,4,7,3,7,4,6,8,2,9,1,5,9,5,1,7,4,3,6,2,8,5,1,9,3,2,6,8,7,4,2,4,8,9,5,7,1,3,6,7,6,3,4,1,8,2,5,9];
let perm=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5), map=[0,...perm.map(x=>x+1)];return base.map(n=>map[n]);}
function start(){solution=makeSolution();values=puzzle.map(n=>n?solution.findIndex((v,i)=>v===mapValue(n)):0);/* replaced below using source digit map */
// Keep the puzzle's pattern while independently permuting the nine colors.
const canonical=[4,3,5,2,6,9,7,8,1,6,8,2,5,7,1,4,9,3,1,9,7,8,3,4,5,6,2,8,2,6,1,9,5,3,4,7,3,7,4,6,8,2,9,1,5,9,5,1,7,4,3,6,2,8,5,1,9,3,2,6,8,7,4,2,4,8,9,5,7,1,3,6,7,6,3,4,1,8,2,5,9];
// Convert each given from the reference puzzle into its matching color in the permuted solution.
const digitToIndex=new Map();solution.forEach((v,i)=>{if(!digitToIndex.has(canonical[i]))digitToIndex.set(canonical[i],v)});
values=puzzle.map(d=>d?digitToIndex.get(d):0);fixed=values.map(Boolean);selected=-1;status.textContent='';paint();}
function mapValue(n){return n}
function paint(){board.innerHTML='';for(let i=0;i<81;i++){let b=document.createElement('button');b.className='cell'+(fixed[i]?' given':'')+(selected===i?' selected':'');b.type='button';b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Rij ${Math.floor(i/9)+1}, kolom ${i%9+1}${values[i]?' ingevuld':' leeg'}`);if(values[i])b.style.backgroundColor=colors[values[i]-1];b.addEventListener('click',()=>{selected=i;if(!fixed[i]&&chosen)bump();paint()});board.appendChild(b)}palette.innerHTML='';colors.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(chosen===i+1?' active':'');b.type='button';b.style.background=c;b.setAttribute('aria-label',['Rood','Oranje','Geel','Groen','Turkoois','Blauw','Paars','Roze','Bruin'][i]);b.title=['Rood','Oranje','Geel','Groen','Turkoois','Blauw','Paars','Roze','Bruin'][i];b.addEventListener('click',()=>{chosen=i+1;if(selected>=0&&!fixed[selected])values[selected]=chosen;status.textContent='';paint()});palette.appendChild(b)})}
function bump(){if(selected>=0&&!fixed[selected])values[selected]=chosen}
function conflicts(){let bad=new Set();for(let i=0;i<81;i++){if(!values[i])continue;for(let j=i+1;j<81;j++){if(values[i]!==values[j])continue;let sameRow=Math.floor(i/9)===Math.floor(j/9),sameCol=i%9===j%9,sameBox=Math.floor(Math.floor(i/9)/3)===Math.floor(Math.floor(j/9)/3)&&Math.floor((i%9)/3)===Math.floor((j%9)/3);if(sameRow||sameCol||sameBox){bad.add(i);bad.add(j)}}}return bad}
document.getElementById('erase').onclick=()=>{if(selected>=0&&!fixed[selected]){values[selected]=0;status.textContent='';paint()}};
document.getElementById('check').onclick=()=>{let bad=conflicts();[...board.children].forEach((c,i)=>c.classList.toggle('conflict',bad.has(i)));if(bad.size)status.textContent='Er staan kleuren dubbel in een rij, kolom of groot vak.';else if(values.includes(0))status.textContent='Tot nu toe klopt alles. Er zijn nog lege vakjes.';else status.textContent='Prachtig: het bord klopt helemaal.'};
document.getElementById('new').onclick=start;
board.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();let d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];selected=Math.max(0,Math.min(80,selected<0?0:selected+d));paint();board.children[selected].focus()});
start();
})();
</script>
</body>
</html>
