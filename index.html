<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2eee6">
<title>Kleur-sudoku</title>
<style>
:root{color-scheme:light;--ink:#263238;--muted:#687477;--panel:#fffdf8;--line:#c9c4b8;--heavy:#5b625d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -8%,#fffdf6 0,#f2eee6 60%);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:14px 8px 24px}
main{width:min(100%,900px)}header{text-align:center;margin:3px 0 10px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 3px;font-weight:750;color:#263831}header p{margin:0;color:var(--muted);font-size:13px}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}label{font-size:13px;color:#53615a}select,button.action{font:600 13px system-ui;color:#34413a;background:#f8f5ed;border:1px solid #d5d0c5;border-radius:999px;padding:9px 13px}select{border-radius:10px}button.action{cursor:pointer}button.action.primary{background:#2d453a;color:white;border-color:#2d453a}button.action:hover{filter:brightness(.97)}
.machine{width:min(96vw,84vh,760px);aspect-ratio:1;position:relative;margin:0 auto;background:#f3efe6;border-radius:5px;overflow:visible}
.frame-art{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.board{position:absolute;left:13.25%;top:13.3%;width:73.45%;aspect-ratio:1;display:grid;border:2px solid #a7844c;border-radius:3px;overflow:hidden;background:#fff;z-index:2;touch-action:manipulation}
.cell{min-width:0;min-height:0;padding:0;border:0;background:#fff;cursor:pointer;transition:filter .1s,box-shadow .1s}.cell.given{cursor:default}.cell.selected{box-shadow:inset 0 0 0 3px #172b23;z-index:1;filter:saturate(1.08)}.cell.conflict{box-shadow:inset 0 0 0 3px #a63332;z-index:2}.cell:focus-visible{outline:2px solid #172b23;outline-offset:-3px;z-index:3}
.palette{position:absolute;left:89.35%;top:15.2%;width:6.45%;height:69.8%;display:grid;grid-template-rows:repeat(15,minmax(0,1fr));gap:.32%;z-index:6}.swatch{position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:40%;background:transparent;cursor:pointer;touch-action:manipulation}.swatch::before{content:"";position:absolute;inset:12% 8%;border-radius:38%;background:var(--tint);mix-blend-mode:color;opacity:.78;pointer-events:none}.swatch.active{outline:2px solid #fff6d6;box-shadow:0 0 0 3px #293c33;z-index:1}.swatch.active::before{opacity:.38}.swatch.disabled{cursor:default;pointer-events:none}.swatch.disabled::after{content:"";position:absolute;inset:13% 9%;border-radius:34%;background:rgba(7,20,15,.78);box-shadow:inset 0 0 0 1px #b59660;pointer-events:none}
.status{text-align:center;min-height:20px;margin:8px auto 0;color:#52635a;font-size:13px}.legend{text-align:center;color:#7b8079;font-size:12px;margin-top:0}
@media(max-width:500px){body{padding:8px 3px 16px}.machine{width:min(98vw,80vh,760px)}.board{border-width:1px}.cell.selected{box-shadow:inset 0 0 0 2px #172b23}.swatch.active{outline-width:1px;box-shadow:0 0 0 2px #293c33}}
</style>
</head>
<body>
<main>
<header><h1>Kleur-sudoku</h1><p>Elke kleur één keer per rij, kolom en groot vak.</p></header>
<div class="controls"><label for="size">Bordgrootte</label><select id="size"><option value="9">9 × 9</option><option value="12">12 × 12</option><option value="15">15 × 15</option></select><button class="action" id="erase">Wis vakje</button><button class="action primary" id="check">Controleer</button><button class="action" id="new">Nieuw bord</button></div>
<div class="machine" id="machine" aria-label="Kleur-sudoku met houten kader">
<div class="board" id="board" role="grid" aria-label="Sudokubord"></div>
<div class="palette" id="palette" role="toolbar" aria-label="Kies de kleur voor je volgende plaatsing"></div>

 size=Number(sizeSelect.value);boxH=3;boxW=size/3;chosen=0;selected=-1;status.textContent='';
 const rows=groupedOrder(size,boxH),cols=groupedOrder(size,boxW),symbols=shuffle(Array.from({length:size},(_,i)=>i+1));solution=Array(size*size);
 for(let r=0;r<size;r++)for(let c=0;c<size;c++)solution[r*size+c]=symbols[(rows[r]*boxW+Math.floor(rows[r]/boxH)+cols[c])%size];
 const clues=Math.round(size*size*(size===9?.47:size===12?.49:.51));values=Array(size*size).fill(0);fixed=Array(size*size).fill(false);
 shuffle(Array.from({length:size*size},(_,i)=>i)).slice(0,clues).forEach(i=>{values[i]=solution[i];fixed[i]=true});
 legend.textContent=`Grote vakken: drie rijen bij ${boxW} kolommen.`;paint();
}
function paint(){
 board.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;board.innerHTML='';
 for(let i=0;i<size*size;i++){
  const r=Math.floor(i/size),c=i%size,b=document.createElement('button');b.type='button';b.className='cell'+(fixed[i]?' given':'')+(selected===i?' selected':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Rij ${r+1}, kolom ${c+1}${values[i]?' ingevuld':' leeg'}`);b.style.backgroundColor=values[i]?palette[values[i]-1][0]:'#fff';
  b.style.borderRight=c===size-1?'0':(c%boxW===boxW-1?'3px solid #5b625d':'1px solid #c9c4b8');b.style.borderBottom=r===size-1?'0':(r%boxH===boxH-1?'3px solid #5b625d':'1px solid #c9c4b8');
  b.onclick=()=>{selected=i;if(!fixed[i]&&!values[i]&&chosen)values[i]=chosen;status.textContent='';paint()};board.appendChild(b);
 }
 strip.innerHTML='';palette.forEach(([color,name],i)=>{const b=document.createElement('button');b.type='button';b.className='swatch'+(chosen===i+1?' active':'')+(i>=size?' disabled':'');b.style.setProperty('--tint',color);b.title=name;b.setAttribute('aria-label',name+(i>=size?' niet beschikbaar in dit formaat':''));if(i<size)b.onclick=()=>{chosen=i+1;status.textContent='';paint()};strip.appendChild(b)});
}
function conflicts(){const bad=new Set();for(let i=0;i<size*size;i++)if(values[i])for(let j=i+1;j<size*size;j++)if(values[i]===values[j]){const r1=Math.floor(i/size),c1=i%size,r2=Math.floor(j/size),c2=j%size;if(r1===r2||c1===c2||(Math.floor(r1/boxH)===Math.floor(r2/boxH)&&Math.floor(c1/boxW)===Math.floor(c2/boxW))){bad.add(i);bad.add(j)}}return bad}
document.getElementById('erase').onclick=()=>{if(selected>=0&&!fixed[selected]){values[selected]=0;status.textContent='';paint()}};
document.getElementById('check').onclick=()=>{const bad=conflicts();[...board.children].forEach((c,i)=>c.classList.toggle('conflict',bad.has(i)));status.textContent=bad.size?'Er staan kleuren dubbel in een rij, kolom of groot vak.':values.includes(0)?'Tot nu toe klopt alles. Er zijn nog lege vakjes.':'Het bord klopt helemaal.'};
document.getElementById('new').onclick=makeBoard;sizeSelect.onchange=makeBoard;
board.addEventListener('keydown',e=>{const d={ArrowUp:-size,ArrowDown:size,ArrowLeft:-1,ArrowRight:1}[e.key];if(d===undefined)return;e.preventDefault();selected=Math.max(0,Math.min(size*size-1,(selected<0?0:selected)+d));paint();board.children[selected]?.focus()});makeBoard();
})();
</script>
