<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2eee6">
<title>Kleur-sudoku</title>
<style>
:root{color-scheme:light;--ink:#263238;--muted:#687477;--panel:#fffdf8;--line:#c9c4b8;--heavy:#5b625d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -8%,#fffdf6 0,#f2eee6 60%);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:20px 12px 30px}
main{width:min(100%,720px)}header{text-align:center;margin:3px 0 15px}h1{font-size:clamp(25px,5vw,37px);margin:0 0 5px;font-weight:750;color:#263831}header p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid #e1ddd3;border-radius:20px;padding:clamp(10px,3vw,22px);box-shadow:0 12px 36px #433c2710}
.size-row{display:flex;justify-content:center;align-items:center;gap:9px;margin:0 0 14px;color:#53615a;font-size:14px}.size-row select{font:600 14px system-ui;color:#263831;background:#f8f5ed;border:1px solid #d5d0c5;border-radius:10px;padding:8px 11px}
.board-wrap{width:100%;display:flex;justify-content:center}.board{width:min(100%,620px);aspect-ratio:1;display:grid;border:3px solid var(--heavy);border-radius:8px;overflow:hidden;background:#fff;touch-action:manipulation}
.cell{min-width:0;min-height:0;padding:0;border:0;background:#fff;cursor:pointer;transition:filter .1s,box-shadow .1s}.cell.given{cursor:default}.cell.selected{box-shadow:inset 0 0 0 3px #172b23;z-index:1;filter:saturate(1.08)}.cell.conflict{box-shadow:inset 0 0 0 3px #a63332;z-index:2}.cell:focus-visible{outline:3px solid #172b23;outline-offset:-4px;z-index:3}
.palette-label{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 9px}.palette{display:grid;gap:6px;max-width:560px;margin:0 auto}.swatch{min-width:0;aspect-ratio:1;border:2px solid white;border-radius:9px;box-shadow:0 0 0 1px #aaa;cursor:pointer;transition:transform .1s,box-shadow .1s}.swatch:hover{transform:translateY(-2px)}.swatch.active{box-shadow:0 0 0 3px #263831;transform:scale(1.04)}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 3px}button.action{border:1px solid #d5d0c5;border-radius:999px;background:#f8f5ed;color:#34413a;padding:10px 14px;font:600 13px/1 system-ui;cursor:pointer}button.action.primary{background:#2d453a;color:white;border-color:#2d453a}button.action:hover{filter:brightness(.97)}.status{text-align:center;min-height:22px;margin:11px 0 0;color:#52635a;font-size:14px}.legend{text-align:center;color:#7b8079;font-size:12px;margin-top:1px}
@media(max-width:430px){body{padding:10px 7px 20px}.card{border-radius:15px;padding:8px}.board{width:100%}.swatch{border-radius:6px}.palette{gap:4px}.cell.selected{box-shadow:inset 0 0 0 2px #172b23}.controls{gap:6px}button.action{padding:10px 12px;font-size:12px}}
</style>
</head>
<body>
<main>
<header><h1>Kleur-sudoku</h1><p>Elke kleur één keer per rij, kolom en groot vak.</p></header>
<section class="card" aria-label="Kleur-sudoku">
<div class="size-row"><label for="size">Bordgrootte</label><select id="size"><option value="9">9 × 9</option><option value="12">12 × 12</option><option value="15">15 × 15</option></select></div>
<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Sudokubord"></div></div>
<p class="palette-label">Kies een kleur voor je volgende plaatsing</p>
<div class="palette" id="palette" role="toolbar" aria-label="Kleuren"></div>
<div class="controls"><button class="action" id="erase">Wis vakje</button><button class="action primary" id="check">Controleer</button><button class="action" id="new">Nieuw bord</button></div>
<div class="status" id="status" aria-live="polite"></div>
<div class="legend" id="legend"></div>
</section>
</main>
<script>
(()=>{
const palettes={
9:[['#D62828','Rood'],['#F77F00','Oranje'],['#FFD60A','Geel'],['#A8D96C','Lichtgroen'],['#1B5E20','Donkergroen'],['#1565C0','Blauw'],['#7E57C2','Paars'],['#EC407A','Roze'],['#795548','Bruin']],
12:[['#D62828','Rood'],['#F77F00','Oranje'],['#FFD60A','Geel'],['#A8D96C','Lichtgroen'],['#1B5E20','Donkergroen'],['#00897B','Turkoois'],['#25B8B0','Aqua'],['#64B5F6','Lichtblauw'],['#1565C0','Blauw'],['#3949AB','Indigo'],['#7E57C2','Paars'],['#EC407A','Roze']],
15:[['#D62828','Rood'],['#F77F00','Oranje'],['#FFD60A','Geel'],['#A8D96C','Lichtgroen'],['#1B5E20','Donkergroen'],['#00897B','Turkoois'],['#25B8B0','Aqua'],['#64B5F6','Lichtblauw'],['#1565C0','Blauw'],['#283593','Donkerblauw'],['#7E57C2','Paars'],['#AD1457','Fuchsia'],['#F06292','Roze'],['#795548','Bruin'],['#607D8B','Leigrijs']]
};
const board=document.getElementById('board'),palette=document.getElementById('palette'),status=document.getElementById('status'),sizeSelect=document.getElementById('size'),legend=document.getElementById('legend');
let size=9,boxH=3,boxW=3,colors=[],solution=[],values=[],fixed=[],selected=-1,chosen=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function groupedOrder(n,groupSize){const groups=shuffle(Array.from({length:n/groupSize},(_,i)=>i));return groups.flatMap(g=>shuffle(Array.from({length:groupSize},(_,i)=>g*groupSize+i)))}
function makeBoard(){
 size=Number(sizeSelect.value);boxH=3;boxW=size/3;colors=palettes[size];chosen=0;selected=-1;status.textContent='';
 const rows=groupedOrder(size,boxH),cols=groupedOrder(size,boxW),symbols=shuffle(Array.from({length:size},(_,i)=>i+1));
 solution=Array(size*size);
 for(let r=0;r<size;r++)for(let c=0;c<size;c++)solution[r*size+c]=symbols[(rows[r]*boxW+Math.floor(rows[r]/boxH)+cols[c])%size];
 const clueCount=Math.round(size*size*(size===9?.47:size===12?.49:.51));
 values=Array(size*size).fill(0);fixed=Array(size*size).fill(false);
 shuffle(Array.from({length:size*size},(_,i)=>i)).slice(0,clueCount).forEach(i=>{values[i]=solution[i];fixed[i]=true});
 legend.textContent=`Grote vakken: drie rijen bij ${boxW} kolommen.`;
 paint();
}
function paint(){
 board.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;board.innerHTML='';
 for(let i=0;i<size*size;i++){
  const r=Math.floor(i/size),c=i%size,b=document.createElement('button');b.type='button';b.className='cell'+(fixed[i]?' given':'')+(selected===i?' selected':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Rij ${r+1}, kolom ${c+1}${values[i]?' ingevuld':' leeg'}`);
  b.style.backgroundColor=values[i]?colors[values[i]-1][0]:'#fff';
  b.style.borderRight=c===size-1?'0':(c%boxW===boxW-1?'3px solid #5b625d':'1px solid #c9c4b8');
  b.style.borderBottom=r===size-1?'0':(r%boxH===boxH-1?'3px solid #5b625d':'1px solid #c9c4b8');
  b.addEventListener('click',()=>{selected=i;if(!fixed[i]&&!values[i]&&chosen)values[i]=chosen;status.textContent='';paint()});board.appendChild(b);
 }
 palette.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;palette.innerHTML='';
 colors.forEach(([color,name],i)=>{const b=document.createElement('button');b.type='button';b.className='swatch'+(chosen===i+1?' active':'');b.style.backgroundColor=color;b.title=name;b.setAttribute('aria-label',name);b.addEventListener('click',()=>{chosen=i+1;status.textContent='';paint()});palette.appendChild(b)});
}
function conflicts(){const bad=new Set();for(let i=0;i<size*size;i++)if(values[i])for(let j=i+1;j<size*size;j++)if(values[i]===values[j]){const r1=Math.floor(i/size),c1=i%size,r2=Math.floor(j/size),c2=j%size;const sameRow=r1===r2,sameCol=c1===c2,sameBox=Math.floor(r1/boxH)===Math.floor(r2/boxH)&&Math.floor(c1/boxW)===Math.floor(c2/boxW);if(sameRow||sameCol||sameBox){bad.add(i);bad.add(j)}}return bad}
document.getElementById('erase').onclick=()=>{if(selected>=0&&!fixed[selected]){values[selected]=0;status.textContent='';paint()}};
document.getElementById('check').onclick=()=>{const bad=conflicts();[...board.children].forEach((c,i)=>c.classList.toggle('conflict',bad.has(i)));status.textContent=bad.size?'Er staan kleuren dubbel in een rij, kolom of groot vak.':values.includes(0)?'Tot nu toe klopt alles. Er zijn nog lege vakjes.':'Het bord klopt helemaal.'};
document.getElementById('new').onclick=makeBoard;sizeSelect.onchange=makeBoard;
board.addEventListener('keydown',e=>{const d={ArrowUp:-size,ArrowDown:size,ArrowLeft:-1,ArrowRight:1}[e.key];if(d===undefined)return;e.preventDefault();selected=Math.max(0,Math.min(size*size-1,(selected<0?0:selected)+d));paint();board.children[selected]?.focus()});
makeBoard();
})();
</script>
</body>
</html>
